# Funding links for the repo's Sponsor button.
#
# Everything here was inherited from the next-shadcn-dashboard-starter template
# and pointed at that template author's Buy Me a Coffee and PayPal, which meant
# this repo's Sponsor button was collecting money for someone else. Cleared.
#
# Fill in a platform below to turn the Sponsor button back on, or delete this
# file to hide it entirely.

github: # Your GitHub Sponsors username
buy_me_a_coffee: # Your Buy Me a Coffee username
ko_fi: # Your Ko-fi username
custom: # Up to 4 URLs, e.g. ['https://example.com/donate']
